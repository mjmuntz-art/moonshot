name: Moonshot - Read-Only Feed Feasibility Probe
on:
  push:
    branches: [feature/moonshot-independent-monitor]
    paths: ['.github/workflows/moonshot-feed-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect existing public Moonshot JSON schema (read-only)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, sys
          url = 'https://script.google.com/macros/s/AKfycbxnQRWf_pdsaMfmqnXi94I32U8D9bIDPjobU47DutlzhmnL-yy2IcCZpryF9osiyAx1KQ/exec?api=1'
          req = urllib.request.Request(url, headers={'User-Agent':'Moonshot-GitHub-ReadOnly-FeedProbe/1.0'})
          with urllib.request.urlopen(req, timeout=35) as r:
              raw = r.read(5000000)
          data = json.loads(raw)
          if not isinstance(data,dict): raise SystemExit('Expected JSON object')
          print('FEED_OK',json.dumps({'bytes':len(raw),'today':data.get('today'),'top_keys':list(data.keys())[:40]},sort_keys=True))
          for k in ('board','ladder','decisions','locked','windowPicks','results','officialLegs','ladderLegs','windowLegs','mine','myLog'):
              v=data.get(k)
              if isinstance(v,dict):
                  print('SCHEMA',k,json.dumps({'type':'object','keys':list(v.keys())[:50],'date':v.get('date'),'picks_count':len(v.get('picks',[])) if isinstance(v.get('picks'),list) else None,'sample_pick':v.get('picks',[None])[0] if isinstance(v.get('picks'),list) and v.get('picks') else None},default=str,sort_keys=True)[:1600])
              elif isinstance(v,list):
                  print('SCHEMA',k,json.dumps({'type':'list','count':len(v),'sample':v[-1] if v else None},default=str,sort_keys=True)[:1600])
              else:
                  print('SCHEMA',k,json.dumps({'type':type(v).__name__,'value':str(v)[:160]},sort_keys=True))
          PY
