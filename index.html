<!doctype html>
<html lang="en">
<head>
<!-- ▼▼ Paste your Apps Script web-app link (ends in /exec) between the quotes ▼▼ -->
<script>window.MOONSHOT_URL = 'PASTE_YOUR_EXEC_LINK_HERE';</script>
<!-- ▲▲ That is the only line you ever need to change ▲▲ -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Moonshot">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta charset="utf-8">
<meta name="theme-color" content="#070b13">
<title>Moonshot</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b13;--p1:#0f1a2c;--p2:#0b1422;--line:#1d2b42;--line2:#16233a;--txt:#e6ecf5;--mute:#7f93ad;--dim:#5d6f88;--gold:#f1ce50;--grn:#4ef0a8;--red:#ff6b6b;
--off:#4a8dff;--w5:#2bc4b0;--lad:#9b6bff;--lw:#ff5aa5;--me:#ff9a3c;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--sans:'DM Sans',-apple-system,system-ui,sans-serif}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--txt);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;
  background:radial-gradient(1px 1px at 8% 12%,#ffffff70,transparent),radial-gradient(1px 1px at 22% 40%,#ffffff40,transparent),radial-gradient(1.5px 1.5px at 63% 8%,#ffffff80,transparent),radial-gradient(1px 1px at 84% 22%,#ffffff50,transparent),radial-gradient(1px 1px at 48% 30%,#ffffff35,transparent),radial-gradient(1px 1px at 93% 55%,#ffffff40,transparent),
  radial-gradient(ellipse at 78% -12%,#1d3150 0,#0a0f1a 48%,#05070c 100%) fixed;background-color:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.mono{font-family:var(--mono)}.ok{color:var(--grn)}.no{color:var(--red)}.mu{color:var(--mute)}
.k{font:600 10px var(--mono);letter-spacing:1.8px;color:var(--mute);text-transform:uppercase}
.card{background:linear-gradient(180deg,var(--p1),var(--p2));border:1px solid var(--line);border-radius:14px}
/* header */
header{position:sticky;top:0;z-index:20;background:#070b13e6;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;gap:24px;padding:14px 28px;max-width:1440px;margin:auto}
.logo{font:700 15px var(--mono);letter-spacing:3.5px;color:var(--gold)}
.nav{display:flex;gap:4px}.nav button{font:600 12px var(--mono);letter-spacing:1.5px;color:var(--mute);padding:8px 14px;border-radius:8px}
.nav button.on{color:#fff;background:#ffffff12;box-shadow:inset 0 -2px 0 var(--gold)}
.status{margin-left:auto;display:flex;align-items:center;gap:10px;font:11px var(--mono);letter-spacing:.8px;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:#56657a}.dot.live{background:var(--grn);box-shadow:0 0 0 3px #4ef0a826}.dot.busy{background:var(--gold);animation:pl 1s infinite}@keyframes pl{50%{opacity:.3}}
.rf{border:1px solid var(--line);border-radius:8px;padding:5px 9px;color:var(--txt);font:600 12px var(--mono)}
.ticker{border-top:1px solid var(--line2);overflow:hidden;white-space:nowrap}
.ticker .in{display:flex;gap:26px;padding:8px 28px;max-width:1440px;margin:auto;font:12px var(--mono);color:var(--mute);overflow-x:auto;scrollbar-width:none}.ticker .in::-webkit-scrollbar{display:none}
.ticker b{color:var(--txt);font-weight:600}.tk{display:inline-flex;align-items:center;gap:6px}
main{max-width:1440px;margin:auto;padding:22px 28px 60px}
/* layout */
.stack>*{min-width:0}.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.stack{display:grid;gap:16px;align-content:start}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* countdown */
.count{display:flex;align-items:center;gap:26px;padding:16px 20px}
.count .big{font:700 46px/1 var(--mono);letter-spacing:2px;color:#fff;margin-top:6px}
.count .meta{font:12px/1.75 var(--mono);color:#9fb0c6}
/* track card */
.trk{padding:14px 18px 6px}
.th{display:flex;justify-content:space-between;align-items:center;gap:10px}
.th .t{font:700 11px var(--mono);letter-spacing:1.6px;color:var(--c);text-transform:uppercase}
.th .b{font:11px var(--mono);color:var(--mute);text-align:right}
.par{display:flex;align-items:center;gap:10px;margin:8px 0 6px;flex-wrap:wrap}.par strong{font:700 30px var(--mono)}
.pill{font:600 10px var(--mono);letter-spacing:.8px;border-radius:6px;padding:3px 7px;border:1px solid}
.pill.in{color:var(--grn);border-color:#4ef0a855}.pill.out{color:var(--mute);border-color:#7f93ad55}.pill.hot{color:var(--gold);border-color:#f1ce5055}
.gl{display:flex;justify-content:space-between;font:9px var(--mono);color:var(--dim);margin:2px 0 3px}
.gauge{height:7px;border-radius:4px;background:#16233a;position:relative;margin-bottom:8px}
.gauge .z{position:absolute;top:0;bottom:0;background:#4ef0a82a;border-left:1px solid var(--grn);border-right:1px solid var(--grn)}
.gauge .m{position:absolute;top:-4px;width:3px;height:15px;border-radius:2px;background:var(--gold);transform:translateX(-1px)}
.empty{padding:14px 0 12px;color:var(--mute);font-size:13px;border-top:1px dashed var(--line)}
/* leg */
.leg{display:grid;grid-template-columns:24px 54px minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px 0;border-top:1px dashed var(--line)}
.leg .n{font:10px var(--mono);color:var(--mute)}
.who b{font:600 15px var(--sans);color:#fff;display:block;line-height:1.25}
.who .m{font:12.5px var(--sans);color:var(--mute);display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:2px}
.odds{text-align:right}.odds b{font:700 18px var(--mono);color:var(--gold);display:block}.odds span{font:10px var(--mono);color:var(--mute);white-space:nowrap}
.more{grid-column:2 / span 3;display:grid;gap:8px}
.hrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hl{font:11.5px/1.55 var(--mono);color:#9fb0c6}.hl b{color:#fff;font-weight:600}
.badge{font:600 10px var(--mono);padding:3px 8px;border-radius:6px;background:#4ef0a814;color:var(--grn);border:1px solid #4ef0a833;white-space:nowrap}
.badge.cold{background:#ff6b6b12;color:var(--red);border-color:#ff6b6b33}.badge.new{background:#ffffff0a;color:var(--mute);border-color:#ffffff1f}
.chip{font:600 10px var(--mono);letter-spacing:.6px;padding:3px 8px;border-radius:6px;background:#ffffff0d;color:#cfd9e6;white-space:nowrap}
.chip.lock{background:#4a8dff1f;color:#8fb6ff}.chip.wait{background:#f1ce501a;color:var(--gold)}.chip.hit{background:#4ef0a81a;color:var(--grn)}.chip.miss{background:#ff6b6b18;color:var(--red)}
.spark{display:flex;align-items:flex-end;gap:3px;height:30px;position:relative;padding-right:3px;flex:none}
.spark i{width:9px;border-radius:2px 2px 0 0;background:#2d4466;display:block}.spark i.h{background:var(--grn)}
.spark .tl{position:absolute;left:-2px;right:-2px;border-top:1px dashed var(--gold);opacity:.85}
.avg{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{font:600 10px var(--mono);padding:5px 9px;color:var(--mute)}.seg button.on{background:#ffffff14;color:#fff}
.st{font:11px var(--mono);color:#9fb0c6;white-space:nowrap}.st b{font:700 15px var(--mono);color:#fff;margin-right:3px}
.tgl{display:none}
.leg.fold{cursor:pointer}.leg.fold:not(.open) .more{display:none}.leg.fold .tgl{display:inline}.leg.fold .odds span{white-space:normal}.leg.fold{grid-template-columns:54px minmax(0,1fr) auto}.leg.fold .n{display:none}.leg.fold .more{grid-column:1 / span 3}.leg.fold .lv{grid-column:2 / span 2}
/* headshot + logos */
.hsw{position:relative;width:54px;height:54px;flex:none}
.av{width:54px;height:54px;border-radius:50%;overflow:hidden;position:relative;background:linear-gradient(160deg,#1c2a40,#121c2c);box-shadow:inset 0 0 0 2px var(--tc,#2a3b55);display:grid;place-items:center;font:700 16px var(--mono);color:#7f93ad}
.av img.hs{position:absolute;width:74px;left:50%;top:4px;transform:translateX(-50%)}
.av img.lgbig{width:34px;height:34px;object-fit:contain}
.hsw .lb{position:absolute;right:-5px;bottom:-4px;width:24px;height:24px;border-radius:50%;background:#e9eef5;display:grid;place-items:center;box-shadow:0 0 0 2px #0b1320}
.hsw .lb img{width:19px;height:19px;object-fit:contain}
.lg{width:16px;height:16px;object-fit:contain;vertical-align:-3px;background:#e9eef5;border-radius:50%;padding:1.5px}
.mini{width:26px;height:26px;border-radius:50%;overflow:hidden;position:relative;background:#16233a;flex:none;display:inline-block;vertical-align:middle}
.mini img{position:absolute;width:36px;left:50%;top:2px;transform:translateX(-50%)}
/* side */
.side{padding:14px 16px}
.srow{display:grid;grid-template-columns:6px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.srow i{width:6px;height:28px;border-radius:2px;background:var(--c)}
.srow b{font:600 13.5px var(--sans)}.srow small{display:block;font:11px var(--sans);color:var(--mute)}
.srow .r{font:12px var(--mono);color:var(--mute)}.srow .u{font:700 14px var(--mono);text-align:right;min-width:66px}
.ln{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font:12.5px var(--sans)}
.ln .lbl{font:600 11px var(--mono);letter-spacing:.8px}
.link{color:#9fb0c6;text-decoration:underline;font:12px var(--sans)}
/* results */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{padding:14px 16px;border-top:3px solid var(--c)}.kpi .k{color:var(--c)}.kpi b{font:700 30px var(--mono);display:block;margin:6px 0 2px}.kpi span{font:11px var(--mono);color:var(--mute);display:block}
.chartcard{padding:14px 16px;position:relative}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.legend button{font:600 11px var(--mono);color:#cfd9e6;display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:7px;border:1px solid var(--line)}
.legend button i{width:12px;height:3px;border-radius:2px;background:var(--c)}.legend button.off{opacity:.35}
svg.chart{width:100%;height:auto;display:block;touch-action:pan-y}
.tip{position:absolute;z-index:3;background:#0a1220f5;border:1px solid #2f4566;border-radius:10px;padding:10px 12px;font:11.5px var(--mono);color:#cfd9e6;box-shadow:0 12px 28px #000b;min-width:250px;pointer-events:none}
.tip .d{font:600 12.5px var(--sans);color:#fff;margin-bottom:6px}
.tip .r{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;padding:2px 0}.tip .r i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.tip .who2{margin-top:6px;color:var(--mute);white-space:normal;line-height:1.5;max-width:330px}
.tipbelow{display:none}
table{width:100%;border-collapse:collapse}
th{font:600 10px var(--mono);letter-spacing:1.4px;color:var(--mute);text-align:left;padding:8px 10px;text-transform:uppercase}
td{padding:10px;border-top:1px solid var(--line);font:13px var(--sans);vertical-align:middle}
td.u,th.u{text-align:right;font-family:var(--mono);font-weight:700;white-space:nowrap}
.tag{display:inline-block;font:700 10px var(--mono);letter-spacing:.6px;padding:3px 7px;border-radius:5px;white-space:nowrap}
.t-all{background:#4ef0a81f;color:var(--grn)}.t-part{background:#f1ce501c;color:var(--gold)}.t-zero{background:#ff6b6b18;color:var(--red)}.t-nb{background:#ffffff10;color:var(--mute)}.t-pend{background:#4a8dff1a;color:#8fb6ff}
.dots{display:inline-flex;gap:3px;vertical-align:middle}.dots i{width:9px;height:9px;border-radius:50%;background:#2d4466}.dots i.h{background:var(--grn)}.dots i.m{background:var(--red)}
.pname{display:flex;align-items:center;gap:10px}
.pname b{font-weight:600}
/* players page */
.search{width:100%;max-width:420px;background:#0b1422;border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--txt);font:14px var(--sans)}
.prow{border-top:1px solid var(--line)}
.prow>button{width:100%;display:grid;grid-template-columns:54px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 4px;text-align:left}
.prow .rec{font:700 15px var(--mono)}
.pdet{padding:4px 4px 16px 72px;display:none;gap:12px}
.prow.open .pdet{display:grid}
.gamelog td,.gamelog th{padding:6px 8px;font-size:12px}
.foot{color:var(--dim);font:11px var(--mono);margin-top:30px;letter-spacing:.5px}
.err{border-left:4px solid var(--red);padding:14px 16px}

/* live */
.lv{grid-column:3 / span 2;margin-top:0 !important;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font:12px var(--mono);color:#cfd9e6}
.lv b{font:700 16px var(--mono);color:#fff}.lv.hit b{color:var(--grn)}.lv.miss b{color:var(--red)}
.prog{display:inline-flex;gap:3px}.prog i{width:14px;height:7px;border-radius:2px;background:#22324c}.prog i.f{background:var(--gold)}.lv.hit .prog i.f{background:var(--grn)}.lv.miss .prog i.f{background:#7a3a3a}
.ondot{width:7px;height:7px;border-radius:50%;background:var(--grn);box-shadow:0 0 0 3px #4ef0a826;display:inline-block}
.warn{color:#ffb35c}
.livebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 8px;font:11px var(--mono);color:var(--mute)}
.livebar .pill{font-size:10px}
.pill.live{color:#ff6b6b;border-color:#ff6b6b66}.pill.live:before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#ff6b6b;margin-right:5px;vertical-align:1px;animation:pl 1.4s infinite}
.pill.cash{color:var(--grn);border-color:#4ef0a866}.pill.dead{color:var(--red);border-color:#ff6b6b55}
.board{padding:12px 16px}.games{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:8px}.games::-webkit-scrollbar{display:none}
.gm{flex:none;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:150px;background:#0a1220}
.gm.ours{border-color:#f1ce5055}.gm .r{display:flex;justify-content:space-between;align-items:center;gap:10px;font:600 13px var(--mono)}.gm .r span{display:flex;align-items:center;gap:6px}
.gm .s{font:10.5px var(--mono);color:var(--mute);margin-top:4px;letter-spacing:.4px}.gm.in .s{color:#ff8b8b}
.gm .lose{color:var(--mute)}
/* phone tabs */
.tabs{display:none}
.tabbar{display:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f1a2c;border:1px solid var(--line);color:#fff;padding:10px 16px;border-radius:10px;font:12.5px var(--sans);z-index:40;max-width:90%}.hidden{display:none}
@media (max-width:1100px){.cols{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){
  .top{padding:10px 16px}.nav{display:none}.status .txt{display:none}.logo{font-size:13px}
  .ticker .in{padding:7px 16px;gap:18px;font-size:11px}
  main{padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
  .count{padding:12px 14px;gap:12px;flex-wrap:wrap}.count .big{font-size:38px}.count .meta{font-size:11px;line-height:1.6}
  .duo{grid-template-columns:1fr}
  .tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px}.tabs::-webkit-scrollbar{display:none}
  .tabs button{font:600 10.5px var(--mono);letter-spacing:.6px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
  .tabs button.on{color:#fff;border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
  .trackwrap>.trk{display:none}.trackwrap>.trk.sel{display:block}
  .trk{padding:12px 14px 4px}.par strong{font-size:26px}
  .leg{grid-template-columns:54px minmax(0,1fr) auto;gap:6px 10px}.leg .n{display:none}
  .more{grid-column:1 / span 3}.leg .lv{grid-column:2 / span 2}
  .cols{grid-template-columns:minmax(0,1fr)}.stack>*{min-width:0}
  .odds span{white-space:normal;display:block;max-width:84px;margin-left:auto;line-height:1.5}.who b{font-size:14.5px}
  .leg:not(.open) .more{display:none}
  .tgl{display:inline;font:11px var(--mono);color:var(--mute)}
  .kpis{grid-template-columns:1fr 1fr}.kpi b{font-size:24px}
  .tip{display:none}.tipbelow{display:block;position:static;margin-top:10px;min-width:0;pointer-events:auto}
  .hide-sm{display:none}td,th{padding:8px 6px}
  .pdet{padding-left:4px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:#070b12f5;border-top:1px solid var(--line);justify-content:space-around;padding:10px 0 calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .tabbar button{font:600 11px var(--mono);letter-spacing:1.2px;color:#6c7d94;padding:6px 14px}.tabbar button.on{color:var(--gold)}
  .side{padding:12px 14px}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <span class="logo">MOONSHOT</span>
    <nav class="nav" id="nav"><button data-view="today" class="on">TODAY</button><button data-view="results">RESULTS</button><button data-view="players">PLAYERS</button></nav>
    <div class="status"><span class="dot" id="dot"></span><span class="txt" id="stamp">Loading…</span><button class="rf" id="refresh" aria-label="Refresh">↻</button></div>
  </div>
  <div class="ticker"><div class="in" id="ticker"></div></div>
</header>
<main id="main"><div class="card" style="padding:18px"><span class="k">Loading today's board…</span></div></main>
<nav class="tabbar" id="tabbar"><button data-view="today" class="on">TODAY</button><button data-view="results">RESULTS</button><button data-view="players">PLAYERS</button></nav>
<div class="toast hidden" id="toast"></div>
<script>
'use strict';
/* ================= state ================= */
var D = null, view = 'today', span = 'L10', mTrack = null, openLegs = {}, openPlayers = {}, hidden = {}, sel = null, q = '', loadedAt = 0, busy = false, IDS = {}, LEGS = [], HIST = {};
var TR = {
  off: { name: 'Official 5+', c: '#4a8dff', key: 'official', note: 'locked trial' },
  w5: { name: '5+ window', c: '#2bc4b0', key: 'five_window', note: 'since Oct 27', wt: '5+ WINDOW' },
  lad: { name: 'Ladder', c: '#9b6bff', key: 'ladder', note: 'best rung per player' },
  lw: { name: 'Ladder window', c: '#ff5aa5', key: 'ladder_window', note: 'since Oct 27', wt: 'LADDER WINDOW' },
  me: { name: 'My picks', c: '#ff9a3c', key: 'my_picks', note: 'your own' }
};
